  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0;

      padding: 32px;

      color: #f4f7fb;
      font: 15px/1.65 'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin: 0 0 22px; }
    .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .project { display: flex; align-items: center; gap: 9px; margin: 0 0 5px; color: #bbc8db; font-size: 13px; }
    .pulse-dot, .card-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .pulse-dot { background: #34d399; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse-dot { animation: pulse 1.6s ease-in-out 2; }
    }
    @keyframes pulse { 50% { opacity: 0.52; } }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 38px); line-height: 1.2; letter-spacing: -0.035em; }
    .subtitle { margin: 10px 0 0; color: #bbc8db; font-size: 14px; }
    .diagram-container {
      margin: 0;
      overflow: auto;
      background: #0b1224;
      border: 1px solid #263753;
      border-radius: 12px;
    }
    svg { display: block; width: 100%; min-width: 950px; }
    .pan-hint { display: none; margin: 8px 0 0; color: #bbc8db; font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .card { background: #0b1224; border: 1px solid #263753; border-radius: 9px; padding: 14px 16px; }
    .card h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 0; color: #bbc8db; font-size: 13px; overflow-wrap: anywhere; }
    .footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid #263753; color: #bbc8db; font-size: 12px; }
    .footer p { margin: 7px 0 0; }
    .footer nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .footer a { color: #a8e5f1; text-underline-offset: 3px; }
    .toolbar { display: flex; position: relative; align-items: center; flex-shrink: 0; }
    .toolbar-toggle, .toolbar-actions button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px;
      color: #e2e8f0;
      border: 1px solid #344662;
      background: #0f1b30;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }
    .toolbar-toggle { font-size: 23px; line-height: 1; }
    .toolbar-toggle:hover, .toolbar-actions button:hover { background: #20304a; }
    .toolbar-actions {
      position: absolute;
      top: 50px;
      right: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: #0b1224;
      border: 1px solid #344662;
      border-radius: 8px;
      box-shadow: 0 10px 24px #020617aa;
    }
    .toolbar-actions[hidden] { display: none; }
    .toolbar-actions button { font-size: 13px; white-space: nowrap; }
    :where(button, a, figure):focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }
    .export-status { margin: 8px 0 0; color: #fbbf24; font-size: 13px; }
    .export-status:empty { display: none; }
    @media (max-width: 1015px) {
      body { padding: 14px; }
      .pan-hint { display: block; }
    }
    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }
    body.export-layout { width: 1264px; padding: 32px; }
    .export-layout h1 { font-size: 38px; }
    .export-layout .pan-hint { display: none; }
    .export-layout .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media print {
      body { padding: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar, .pan-hint { display: none !important; }
      svg { min-width: 0; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .diagram-container, .card { break-inside: avoid; }
    }
  </style>
</head>

  <script>
    const report = document.getElementById('report-container');
    const toolbar = document.querySelector('.toolbar');
    const toggle = document.querySelector('.toolbar-toggle');
    const actions = document.querySelector('.toolbar-actions');
    const status = document.querySelector('.export-status');
    const outputName = 'concept-discovery-business-architecture';

    function showActions(expanded) {
      toggle.setAttribute('aria-expanded', String(expanded));
      actions.hidden = !expanded;
      if (!expanded) toggle.focus();
    }

    toggle.addEventListener('click', () => showActions(actions.hidden));
    toolbar.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !actions.hidden) showActions(false);
    });

    async function capture() {
      await document.fonts.ready;
      document.body.classList.add('export-layout');
      try {
        const bounds = report.getBoundingClientRect();
        const padding = 32;
        return html2canvas(document.body, {
          backgroundColor: '#020617',
          scale: 2,
          useCORS: true,
          x: bounds.left + window.scrollX - padding,
          y: bounds.top + window.scrollY - padding,
          width: Math.ceil(bounds.width + padding * 2),
          height: Math.ceil(bounds.height + padding * 2),
          windowWidth: 1264,
          scrollX: 0,
          scrollY: 0,
          ignoreElements: (element) => element.classList?.contains('toolbar'),
          onclone: (clonedDocument) => {
            clonedDocument.body.classList.add('export-layout');
            clonedDocument.querySelector('.diagram-container').scrollLeft = 0;
          },
        });
      } finally {
        document.body.classList.remove('export-layout');
      }
    }

    async function copyAsImage() {
      const image = capture().then((canvas) => new Promise((resolve, reject) => {
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('PNG')), 'image/png');
      }));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': image })]);
    }

    async function downloadPNG() {
      const canvas = await capture();
      const link = document.createElement('a');
      link.download = outputName + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function downloadPDF() {
      const canvas = await capture();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
        unit: 'px',
        compress: true,
        format: [canvas.width, canvas.height],
        hotfixes: ['px_scaling'],
      });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height, undefined, 'FAST');
      pdf.save(outputName + '.pdf');
    }

    const exportsByType = { copy: copyAsImage, png: downloadPNG, pdf: downloadPDF };
    actions.addEventListener('click', async ({ target }) => {
      const type = target.dataset.export;
      if (!type || actions.getAttribute('aria-busy') === 'true') return;
      if (!window.html2canvas || (type === 'pdf' && !window.jspdf)) {
        status.textContent = '导出组件未加载，请联网后重新打开。';
        return;
      }
      if (type === 'copy' && (!navigator.clipboard?.write || !window.ClipboardItem)) {
        status.textContent = '当前浏览器无法复制图片。可以下载 PNG。';
        return;
      }
      actions.setAttribute('aria-busy', 'true');
      status.textContent = '';
      try {
        await exportsByType[type]();
        status.textContent = type === 'copy' ? '已复制图片。' : '已下载文件。';
      } catch {
        status.textContent = type === 'copy' ? '复制失败。可以下载 PNG。' : '导出失败，请重试。';
      } finally {
        actions.removeAttribute('aria-busy');
      }
    });
  </script>
