# Include in the protected HTTPS server block. Leave ACME on the HTTP vhost.
auth_request /_concept_discovery_lifecycle_ready;

location = /_concept_discovery_lifecycle_ready {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:6806/api/readiness;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Length "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
}
